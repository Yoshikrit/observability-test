name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels: ["feature", "enhancement"]
  - title: "🐛 Fixes"
    labels: ["fix", "bug"]
  - title: "🔒 Security"
    labels: ["security"]
  - title: "🧹 Chores"
    labels: ["chore", "dependencies"]

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
exclude-labels: ["skip-changelog"]

version-resolver:
  major:
    labels: ["breaking"]
  minor:
    labels: ["feature", "enhancement"]
  patch:
    labels: ["fix", "bug", "chore", "dependencies", "security"]
  default: patch

template: |
  ## Changes

  $CHANGES
