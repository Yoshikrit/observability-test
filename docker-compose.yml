services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV}
      APP_PORT: ${APP_PORT}
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      ACCESS_LOG_ENABLED: ${ACCESS_LOG_ENABLED}
      TRACE_CONSOLE_EXPORT_ENABLED: ${TRACE_CONSOLE_EXPORT_ENABLED}
      TRACE_OTLP_ENDPOINT: ${TRACE_OTLP_ENDPOINT}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: dhi.io/postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: observability_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  loki:
    image: dhi.io/loki:3
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml

  alloy:
    image: dhi.io/alloy:1
    ports:
      - "12345:12345"
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # non-root by default (uid 473) - needs root's group to read the
    # docker socket, and an explicit writable storage path (no shell to
    # mkdir a relative default dir like the old image tolerated).
    group_add:
      - "0"
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - loki
      - tempo
      - mimir
      - api

  tempo:
    image: dhi.io/tempo:3
    ports:
      - "3200:3200"
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo.yaml:ro
    command: -config.file=/etc/tempo.yaml

  mimir:
    image: dhi.io/mimir:3
    ports:
      - "9009:9009"
    volumes:
      - ./deploy/mimir/mimir.yaml:/etc/mimir.yaml:ro
    command: -config.file=/etc/mimir.yaml

  grafana:
    image: dhi.io/grafana:13
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    depends_on:
      - loki
      - tempo
      - mimir
