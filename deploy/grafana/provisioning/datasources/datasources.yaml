apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Jump from a trace straight to its matching Loki logs, filtered by
      # trace_id - works because that's the exact structured metadata field
      # name Alloy attaches in the logs pipeline.
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true

  - name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir:9009/prometheus
